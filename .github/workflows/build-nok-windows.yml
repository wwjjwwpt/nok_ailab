name: Build NOK Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-installer
    paths:
      - "NOK_Product_Insight/**"
      - ".github/workflows/build-nok-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: NOK_Product_Insight

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: NOK_Product_Insight/requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run automated tests
        shell: pwsh
        run: python -m unittest tests.test_loader tests.test_metrics tests.test_exporter tests.test_windows_packaging -v

      - name: Generate Windows icon
        shell: pwsh
        run: python scripts/create_windows_icon.py

      - name: Build portable EXE
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean NOK_Product_Insight.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\NOK_Product_Insight.exe release\NOK_Product_Insight_Portable_v1.1.0_x64.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\NOK_Product_Insight.iss

      - name: Show SHA-256 checksums
        shell: pwsh
        run: Get-FileHash release\*.exe -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: NOK_Product_Insight_Windows_v1.1.0
          path: NOK_Product_Insight/release/*.exe
          if-no-files-found: error
          retention-days: 14
