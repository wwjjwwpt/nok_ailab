name: Deploy to Aliyun ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aliyun-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment files
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          WEB_ENV: ${{ secrets.WEB_ENV }}
        run: |
          set -euo pipefail
          mkdir -p .deploy-secrets
          printf '%s\n' "$APP_ENV" > .deploy-secrets/backend.env
          printf '%s\n' "$WEB_ENV" > .deploy-secrets/frontend.env

      - name: Upload release to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME || secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          source: "NOK_Nexus,NOK_Nexus_Web,NOK_Nexus_MiniProgram,infra,docs,docker-compose.yml,README.md,README_PERMISSION.md,.gitignore,.deploy-secrets"
          target: "/tmp/nok_ailab_release/${{ github.sha }}"
          rm: true

      - name: Deploy on ECS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME || secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${DEPLOY_PATH:-/opt/nok_ailab}"
            RELEASE_DIR="/tmp/nok_ailab_release/${{ github.sha }}"

            # 安装 Docker (支持阿里云 Linux)
            if ! command -v docker >/dev/null 2>&1; then
              # 检测系统类型
              if [ -f /etc/os-release ]; then
                . /etc/os-release
              fi

              # 阿里云 Linux 使用 yum 安装
              if [ "${ID}" = "alinux" ] || [ "${ID}" = "centos" ] || [ "${ID}" = "rhel" ]; then
                yum install -y yum-utils
                yum-config-manager --add-repo https://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
                yum install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
                systemctl enable docker
                systemctl start docker
              else
                # 其他系统使用官方脚本
                curl -fsSL https://get.docker.com | sh
              fi
            fi

            # Configure Docker Hub mirrors for Aliyun ECS, where direct Docker Hub
            # metadata requests often time out during image builds.
            mkdir -p /etc/docker
            cat > /etc/docker/daemon.json <<'EOF'
            {
              "registry-mirrors": [
                "https://b9pmyelo2ap8sz4a.mirror.aliyuncs.com",
                "https://docker.m.daocloud.io",
                "https://mirror.ccs.tencentyun.com"
              ]
            }
            EOF
            systemctl daemon-reload || true
            systemctl enable docker
            systemctl restart docker
            docker info

            mkdir -p "$APP_DIR"
            rm -rf \
              "$APP_DIR/NOK_Nexus" \
              "$APP_DIR/NOK_Nexus_Web" \
              "$APP_DIR/NOK_Nexus_MiniProgram" \
              "$APP_DIR/infra" \
              "$APP_DIR/docs" \
              "$APP_DIR/docker-compose.yml" \
              "$APP_DIR/README.md" \
              "$APP_DIR/README_PERMISSION.md" \
              "$APP_DIR/.gitignore"
            cp -a "$RELEASE_DIR"/. "$APP_DIR"/

            cd "$APP_DIR"
            mkdir -p NOK_Nexus/logs
            mv .deploy-secrets/backend.env NOK_Nexus/.env
            mv .deploy-secrets/frontend.env NOK_Nexus_Web/.env.local
            rm -rf .deploy-secrets
            export NEXT_PUBLIC_API_BASE_URL="$(grep -E '^(NEXT_PUBLIC_API_BASE_URL|API_BASE_URL)=' NOK_Nexus_Web/.env.local | tail -n 1 | cut -d '=' -f 2-)"
            if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
              export NEXT_PUBLIC_API_BASE_URL="http://${{ secrets.ECS_HOST }}:8000"
            fi
            printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "$NEXT_PUBLIC_API_BASE_URL"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            else
              COMPOSE="docker-compose"
            fi

            for attempt in 1 2 3; do
              if $COMPOSE up -d --build --remove-orphans; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                exit 1
              fi
              docker builder prune -af || true
              sleep $((attempt * 20))
            done
            $COMPOSE ps
